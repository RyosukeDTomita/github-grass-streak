name: Deno Test

on:
  push:
    # main以外へのpush
    branches-ignore:
      - main
    paths:
      - "**/*.ts"
      - ".github/workflows/deno_test.yml"
      - "flake.nix"
      - "flake.lock"
      - deno.lock
      - deno.jsonc
  # mainブランチへのPRとその更新
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.ts"
      - ".github/workflows/deno_test.yml"
      - "flake.nix"
      - "flake.lock"
      - deno.lock
      - deno.jsonc

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: cachix/install-nix-action@8887e596b4ee1134dae06b98d573bd674693f47c # v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run Deno tests with coverage
        run: nix develop --command -- deno test --allow-net --allow-env --coverage=coverage

      - name: Generate LCOV coverage report
        run: nix develop --command -- deno coverage coverage --lcov --output=coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          files: ./coverage.lcov
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
